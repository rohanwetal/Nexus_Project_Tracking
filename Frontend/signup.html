<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus – Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">

  <!-- ✅ LEFT SIDE (IMAGE ONLY - SAME AS LOGIN) -->
  <div class="auth-left"></div>

  <!-- ✅ RIGHT SIDE (SIGNUP FORM) -->
  <div class="auth-right">
    <div class="auth-card">

      <h2>Create Account</h2>
      <p>Register for Nexus Project Tracking</p>

      <form id="signupForm">

        <div class="form-group">
          <label>Full Name</label>
          <input 
            type="text" 
            id="name" 
            placeholder="Your full name" 
            required
          >
        </div>

        <div class="form-group">
          <label>Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="you@gainwellengineering.com" 
            required
          >
        </div>

        <div class="form-group">
          <label>Employee ID</label>
          <input 
            type="text" 
            id="employeeId" 
            placeholder="e.g. GEPL0106" 
            required 
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label>Centre of Excellence (CoE)</label>
          <select id="coeRole" required>
            <option value="">— Select your CoE / Role —</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Electrical">Electrical</option>
            <option value="Hydraulics">Hydraulics</option>
            <option value="Virtual Manufacturing Engineering">Virtual Manufacturing Engineering</option>
            <option value="Lean Manufacturing & Tool Design">Lean Manufacturing & Tool Design</option>
            <option value="Digital Tech. & Program Management">Digital Tech. & Program Management</option>
            <option value="Admin">Admin</option>
          </select>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Create a password (min 6 chars)" 
            required
          >
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Repeat your password" 
            required
          >
        </div>

        <button type="submit" class="btn-primary-full">
          Create Account →
        </button>

      </form>

      <p class="switch">
        Already have an account? 
        <a href="index.html">Sign in</a>
      </p>

    </div>
  </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="shared.js"></script>

<script>
  // Redirect if already logged in
  if (getSession()) {
    window.location.href = 'home.html';
  }

  document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const empId   = document.getElementById('employeeId').value.trim();
    const coeRole = document.getElementById('coeRole').value;
    const pw      = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!name || !email || !empId || !coeRole || !pw || !confirm) {
      showToast('Please fill all fields', 'error');
      return;
    }

    if (pw.length < 6) {
      showToast('Password must be at least 6 characters', 'error');
      return;
    }

    if (pw !== confirm) {
      showToast('Passwords do not match', 'error');
      return;
    }

    const btn = document.querySelector('.btn-primary-full');
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    try {
      const res = await fetch(`${API_BASE}/auth/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          email,
          employeeId: empId,
          password: pw,
          coeRole
        })
      });

      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || 'Signup failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account →';
        return;
      }

      showToast('Account created successfully!', 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);

    } catch (err) {
      showToast('Cannot reach server. Is it running?', 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account →';
    }
  });
</script>

</body>
</html>
