<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus – Login</title>
  <!-- subtitle updated: Project Tracking (no Portal) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">

  <!-- ✅ LEFT SIDE (IMAGE ONLY) -->
  <div class="auth-left"></div>

  <!-- ✅ RIGHT SIDE (LOGIN FORM) -->
  <div class="auth-right">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p>Sign in to Nexus Project Tracking</p>

      <form id="loginForm">

        <div class="form-group">
          <label>Employee ID</label>
          <input 
            type="text" 
            id="employeeId" 
            placeholder="e.g. GEPL0106" 
            required 
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label>Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password" 
            required
          >
        </div>

        <button type="submit" class="btn-primary-full">
          Sign In →
        </button>

      </form>

      <p class="switch">
        Don't have an account? 
        <a href="signup.html">Create one</a>
      </p>
    </div>
  </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="shared.js"></script>

<script>
  // Redirect if already logged in
  if (getSession()) {
    window.location.href = 'home.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const id = document.getElementById('employeeId').value.trim();
    const pw = document.getElementById('password').value.trim();

    if (!id || !pw) {
      showToast('Please fill all fields', 'error');
      return;
    }

    const btn = document.querySelector('.btn-primary-full');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          employeeId: id,
          password: pw
        })
      });

      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || 'Login failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In →';
        return;
      }

      // Save session (user + token)
      saveSession(data.user, data.token);

      showToast('Login successful!', 'success');

      setTimeout(() => {
        window.location.href = 'home.html';
      }, 800);

    } catch (err) {
      showToast('Cannot reach server. Is it running?', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In →';
    }
  });
</script>

</body>
</html>
